<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Selected interfaces: a web dashboard and two mobile apps">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FD6B4"/><stop offset="1" stop-color="#22B8CF"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1E3D42"/></pattern>
<style>.a{transform-box:fill-box;animation-fill-mode:both;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.up{animation-name:up;animation-duration:.8s}.fade{animation-name:fade;animation-duration:.6s}
.pop{transform-origin:center;animation-name:pop;animation-duration:.55s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
.left{animation-name:left;animation-duration:.8s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes left{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.rise{transform-box:fill-box;animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.bob{transform-box:fill-box;animation:bob 6s ease-in-out 1.6s infinite}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-8px)}}
.line{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.4s cubic-bezier(.16,1,.3,1) 1.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.scroll{transform-box:view-box;animation:scroll 9s cubic-bezier(.65,0,.35,1) 2.6s infinite}
@keyframes scroll{0%,15%{transform:none}45%,65%{transform:translateY(-140px)}95%,100%{transform:none}}
.hop{animation:hop 4.8s cubic-bezier(.16,1,.3,1) 2.2s infinite}
@keyframes hop{0%,20%{transform:none}25%,45%{transform:var(--p1)}50%,70%{transform:var(--p2)}75%,95%{transform:var(--p3)}100%{transform:none}}</style></defs>
