<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Role: full-stack developer. Focus: interface design, APIs and servers. Approach: designed in Figma, shipped in TypeScript and Lua. Currently building motion_backpacks.">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#13B595"/><stop offset="1" stop-color="#1497B0"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#D3DEDC"/></pattern>
<style>.a{transform-box:fill-box;animation-fill-mode:both;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.up{animation-name:up;animation-duration:.8s}.fade{animation-name:fade;animation-duration:.6s}
.pop{transform-origin:center;animation-name:pop;animation-duration:.55s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
.left{animation-name:left;animation-duration:.8s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes left{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.ind{transform-box:fill-box;transform-origin:left;animation:slide .9s cubic-bezier(.16,1,.3,1) .5s both}
@keyframes slide{from{transform:translateX(-234px) scaleX(.95)}to{transform:none}}
.ti{animation:dim .9s cubic-bezier(.16,1,.3,1) .5s both}@keyframes dim{from{fill:#10282C}to{fill:#6A817D}}
.ta{animation:lit .9s cubic-bezier(.16,1,.3,1) .5s both}@keyframes lit{from{fill:#6A817D}to{fill:#10282C}}</style></defs>
<rect x="1" y="1" width="1198" height="378" rx="18" fill="#FFFFFF" stroke="#D6E1DF" stroke-width="2"/>
<line x1="1" y1="68" x2="1199" y2="68" stroke="#D6E1DF" stroke-width="2"/><text class="ti" x="48" y="44" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#6A817D" text-anchor="start" >Design</text>
<text x="148" y="44" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#6A817D" text-anchor="start" >Prototype</text>
<text class="ta" x="282" y="44" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="600" fill="#10282C" text-anchor="start" >Inspect</text>
<rect class="ind" x="282.0" y="64.0" width="64.0" height="4.0" rx="2" fill="url(#g)" /><g class="a left" style="animation-delay:0.80s"><text x="48" y="128" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#6A817D" text-anchor="start" >Role</text>
<text x="260" y="128" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="500" fill="#10282C" text-anchor="start" >Full-stack developer</text>
</g><g class="a left" style="animation-delay:0.90s"><text x="48" y="190" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#6A817D" text-anchor="start" >Focus</text>
<text x="260" y="190" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="500" fill="#10282C" text-anchor="start" >Interface design, APIs and the servers they run on</text>
</g><g class="a left" style="animation-delay:1.00s"><text x="48" y="252" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#6A817D" text-anchor="start" >Approach</text>
<text x="260" y="252" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="500" fill="#10282C" text-anchor="start" >Designed in Figma, shipped in TypeScript and Lua</text>
</g><g class="a left" style="animation-delay:1.10s"><text x="48" y="314" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="400" fill="#6A817D" text-anchor="start" >Currently</text>
<text x="260" y="314" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="500" fill="#10282C" text-anchor="start" >Building motion_backpacks, a framework-agnostic FiveM system</text>
</g></svg>
