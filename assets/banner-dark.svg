<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="vexsolution, full-stack developer who designs the interfaces he builds.">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FD6B4"/><stop offset="1" stop-color="#22B8CF"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1E3D42"/></pattern>
<style>.a{transform-box:fill-box;animation-fill-mode:both;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.up{animation-name:up;animation-duration:.8s}.fade{animation-name:fade;animation-duration:.6s}
.pop{transform-origin:center;animation-name:pop;animation-duration:.55s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
.left{animation-name:left;animation-duration:.8s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes left{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.box{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1s cubic-bezier(.16,1,.3,1) .15s forwards}
.wipe{transform-box:fill-box;transform-origin:left;animation:wipe 1s cubic-bezier(.16,1,.3,1) .55s both}
.cur{animation:ride 1s cubic-bezier(.16,1,.3,1) .55s both,blink 1.1s steps(1) 1.6s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:none}}
@keyframes ride{from{transform:translateX(-512px)}to{transform:none}}
@keyframes blink{50%{opacity:0}}</style></defs>
<rect width="1200" height="320" rx="20" fill="#0E2226"/><rect width="1200" height="320" rx="20" fill="url(#dots)"/><defs><clipPath id="reveal"><rect class="wipe" x="90" y="100" width="520" height="110"/></clipPath>
<linearGradient id="sh" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="-100" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;0 0;1100 0" keyTimes="0;.55;1" dur="6s" begin="1.8s" repeatCount="indefinite"/></linearGradient></defs><text class="a up" style="animation-delay:0.90s" x="72" y="92" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="17" font-weight="600" fill="#3DDBBD" text-anchor="start" >Developer</text>
<rect class="box" x="72" y="104" width="560" height="100" fill="none" stroke="url(#g)" stroke-width="2"/><rect class="a pop" style="animation-delay:0.75s" x="66.0" y="98.0" width="12.0" height="12.0" rx="0" fill="#0E2226" stroke="#3DDBBD" stroke-width="2"/><rect class="a pop" style="animation-delay:0.81s" x="626.0" y="98.0" width="12.0" height="12.0" rx="0" fill="#0E2226" stroke="#3DDBBD" stroke-width="2"/><rect class="a pop" style="animation-delay:0.87s" x="626.0" y="198.0" width="12.0" height="12.0" rx="0" fill="#0E2226" stroke="#3DDBBD" stroke-width="2"/><rect class="a pop" style="animation-delay:0.93s" x="66.0" y="198.0" width="12.0" height="12.0" rx="0" fill="#0E2226" stroke="#3DDBBD" stroke-width="2"/><g clip-path="url(#reveal)"><text x="96" y="180" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="76" font-weight="700" textLength="496" lengthAdjust="spacingAndGlyphs"><tspan fill="#F2F7F6">vex</tspan><tspan fill="url(#g)">solution</tspan></text><text x="96" y="180" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="76" font-weight="700" textLength="496" lengthAdjust="spacingAndGlyphs" fill="url(#sh)">vexsolution</text></g><rect class="cur" x="608.0" y="124.0" width="5.0" height="62.0" rx="1" fill="url(#g)" /><g class="a up" style="animation-delay:1.10s"><rect x="307.0" y="216.0" width="90.0" height="26.0" rx="5" fill="#3DDBBD" /><text x="352" y="234" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="600" fill="#0E2226" text-anchor="middle" >560 × 100</text>
</g><text class="a up" style="animation-delay:1.25s" x="72" y="284" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="400" fill="#9DB7B2" text-anchor="start" >Full-stack developer who designs the interfaces he builds.</text>
<text class="a up" style="animation-delay:1.40s" x="1128" y="284" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="600" fill="#3DDBBD" text-anchor="end" >UI, APIs, infrastructure</text>
</svg>
