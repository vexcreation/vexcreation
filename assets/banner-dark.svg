<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FD6B4"/><stop offset="1" stop-color="#22B8CF"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1E3D42"/></pattern>
<style>.a{transform-box:fill-box;animation-fill-mode:both;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.up{animation-name:up;animation-duration:.8s}.fade{animation-name:fade;animation-duration:.6s}
.pop{transform-origin:center;animation-name:pop;animation-duration:.55s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
.left{animation-name:left;animation-duration:.8s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes left{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}

.sweep{animation:sweep 7s linear infinite}@keyframes sweep{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.w0{animation:flow0 14s linear infinite}@keyframes flow0{to{transform:translateX(-1200px)}}.w1{animation:flow1 10s linear infinite}@keyframes flow1{to{transform:translateX(-1200px)}}.w2{animation:flow2 19s linear infinite}@keyframes flow2{to{transform:translateX(-1200px)}}.w3{animation:flow3 8s linear infinite}@keyframes flow3{to{transform:translateX(-1200px)}}.w4{animation:flow4 24s linear infinite}@keyframes flow4{to{transform:translateX(-1200px)}}
.roll{animation:roll 11.00s cubic-bezier(.7,0,.2,1) 1.2s infinite}@keyframes roll{0.00%,20.00%{transform:translateY(0px)} 25.00%,45.00%{transform:translateY(-46px)} 50.00%,70.00%{transform:translateY(-92px)} 75.00%,95.00%{transform:translateY(-138px)} 100%{transform:translateY(-184px)}}
.wipe{transform-box:fill-box;transform-origin:left;animation:wipe 1.1s cubic-bezier(.16,1,.3,1) .2s both}@keyframes wipe{from{transform:scaleX(0)}to{transform:none}}
.glow{animation:glow 4s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.35}50%{opacity:.7}}</style></defs>
